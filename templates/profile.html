<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Xebyngine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Profile CSS -->
    <link rel="stylesheet" href="/jsandcss/profile/css/base.css">
    <link rel="stylesheet" href="/jsandcss/profile/css/animations.css">
    <link rel="stylesheet" href="/jsandcss/profile/css/header.css">
    <link rel="stylesheet" href="/jsandcss/profile/css/profile.css">
    <link rel="stylesheet" href="/jsandcss/profile/css/form.css">
    <link rel="stylesheet" href="/jsandcss/profile/css/responsive.css">
    <link rel="stylesheet" href="/jsandcss/notify.css">
</head>
<body>

<!-- Data from template (JSON format - CSP compliant) -->
<script type="application/json" id="profile-data">
{
    "username": "{{ username }}",
    "urls": {
        "profile": "/profile",
        "uploadedAvatar": "{{ url_for('uploaded_avatar', filename='FILENAME') }}",
        "userPage": "/user/{{ username }}"
    }
}
</script>

<!-- Header with integrated back button -->
<div class="app-header">
    <div class="header-left">
        <a href="/" class="header-back-btn" aria-label="Torna indietro">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div class="header-title">Profilo</div>
    </div>
    <div class="header-spacer"></div>
</div>

<!-- Main Content -->
<div class="main">
    <div class="profile-container">
        <!-- Avatar Section -->
        <div class="profile-avatar-section">
            {% if avatar %}
                <img src="{{ url_for('uploaded_avatar', filename=avatar.split('/')[-1]) }}" 
                     class="profile-avatar" 
                     alt="avatar">
            {% else %}
                <img src="{{ url_for('uploaded_avatar', filename='avatars/default.png') }}" 
                     class="profile-avatar" 
                     alt="avatar">
            {% endif %}
            <h2 class="profile-username">{{ username }}</h2>
        </div>

        <!-- Profile Form -->
        <form method="POST" action="/profile" enctype="multipart/form-data" class="profile-form" id="profile-form">
            <!-- Bio -->
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-user"></i> Descriviti
                </label>
                <textarea name="bio" 
                          rows="4" 
                          maxlength="2000" 
                          placeholder="Scrivi qualcosa su di te...">{{ bio }}</textarea>
            </div>

            <!-- Avatar Upload -->
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-camera"></i> Immagine profilo
                </label>
                <div class="custom-file">
                    <label class="custom-file-btn" for="avatar-upload">
                        <i class="fas fa-upload"></i> Scegli file
                    </label>
                    <input type="file" 
                           id="avatar-upload" 
                           name="avatar" 
                           accept="image/*">
                    <span class="custom-file-text" id="file-name">Nessun file selezionato</span>
                </div>
            </div>

            <!-- Social Links -->
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-link"></i> Collegamenti
                </label>
                <div class="social-links-group" id="social-links-group">
                    {% for i in range(8) %}
                        <div class="social-entry" data-index="{{ i }}" {% if i == 0 or (social_links|length > i and social_links[i]) %} <div style="display:flex"></div> {% else %} <div style="display:none"> {% endif %}
                            <input type="url"
                                   name="social{{ i }}"
                                   placeholder="https://example.com"
                                   maxlength="256"
                                   value="{{ social_links[i] if social_links|length > i else '' }}"
                                   class="profile-social-input"
                                   style="flex:1;">
                            {% if i != 0 %}
                            <button type="button" class="remove-social-btn" title="Rimuovi collegamento">✕</button>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <div style="margin-top:8px;">
                        <button type="button" id="add-social-btn" class="custom-file-btn">
                            <i class="fas fa-plus"></i> Aggiungi collegamento
                        </button>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn" id="submit-btn">
                <i class="fas fa-save"></i> Aggiorna Profilo
            </button>
            <!-- Non volevo scassare il css, lo faccio qui lo spacing dal bottom al button submit-btn-->
            <br><br><br>
        </form>
    </div>
</div>

<!-- CSRF Management (CRITICAL - DO NOT REMOVE) -->
<script src="/jsandcss/csrf.js"></script>

<!-- Profile JavaScript -->
<script src="/jsandcss/notify.js"></script>
<script src="/jsandcss/profile/js/config.js"></script>
<script src="/jsandcss/profile/js/file-upload.js"></script>
<script src="/jsandcss/profile/js/social-links.js"></script>
<script src="/jsandcss/profile/js/form-submit.js"></script>
<script src="/jsandcss/profile/js/init.js"></script>
<script src="/jsandcss/darkness.js"></script>

<!-- Service Worker -->
<script src="/service-worker.js"></script>

</body>
</html>
