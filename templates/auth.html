<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% if 'register' in request.path %}Registrati{% else %}Login{% endif %}</title>
    
    <!-- Auth CSS -->
    <link rel="stylesheet" href="/jsandcss/auth/css/base.css">
    <link rel="stylesheet" href="/jsandcss/auth/css/animations.css">
    <link rel="stylesheet" href="/jsandcss/auth/css/forms.css">
</head>
<body>
    <!-- Tab Switcher - NO CONTAINER -->
    <div class="tab-switcher">
        <button type="button" class="tab-btn active" id="login-tab">Login</button>
        <button type="button" class="tab-btn" id="register-tab">Registrati</button>
    </div>

    <!-- Title - NO CONTAINER -->
    <h2>Accedi</h2>

    <!-- Forms Container - NO WRAPPER -->
    <div class="form-wrapper">
        <!-- Login Form -->
        <form method="POST" action="/login" id="login-form" class="active">
            <div>
                <label>Username:</label>
                <input type="text" name="username" required maxlength="32" autocomplete="username">
            </div>

            <div>
                <label>Password:</label>
                <input type="password" name="password" required maxlength="200" autocomplete="current-password">
            </div>

            <button type="submit">Login</button>
        </form>

        <!-- Register Form -->
        <form method="POST" action="/register" id="register-form">
            <div>
                <label>Username:</label>
                <input type="text" name="username" maxlength="32" required autocomplete="username">
            </div>

            <div>
                <label>Email:</label>
                <input type="email" name="email" maxlength="200" required autocomplete="email">
            </div>

            <div>
                <label>Password:</label>
                <input type="password" name="password" maxlength="200" required autocomplete="new-password">
            </div>

            <button type="submit">Registrati</button>
        </form>
    </div>

    <!-- Bottom text - NO CONTAINER -->
    <p></p>

    <!-- CSRF Management (CRITICAL - DO NOT REMOVE) -->
    <script src="/jsandcss/auth/js/csrf.js"></script>

    <!-- Auth JavaScript -->
    <script src="/jsandcss/auth/js/toggle.js"></script>
    <script src="/jsandcss/auth/js/init.js"></script>
    <script src="/jsandcss/darkness.js"></script>

    <!-- Service Worker -->
    <script src="/jsandcss/sw-linked.js"></script>
</body>
</html>
