<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Xebyngine</title>
    
    <!-- Auth CSS -->
    <link rel="stylesheet" href="/jsandcss/auth/css/auth.css">
    <link rel="stylesheet" href="/jsandcss/notify.css">
</head>
<body>
    <!-- Tab Switcher -->
    <div class="tab-switcher">
        <button type="button" 
                class="tab-btn {% if 'register' not in request.path %}active{% endif %}" 
                data-tab="login">
            Login
        </button>
        <button type="button" 
                class="tab-btn {% if 'register' in request.path %}active{% endif %}" 
                data-tab="register">
            Registrati
        </button>
    </div>

    <!-- Title -->
    <h2 class="ready" data-login-text="Accedi" data-register-text="Crea un account">
        {% if 'register' in request.path %}Crea un account{% else %}Accedi{% endif %}
    </h2>

    <!-- Forms Container -->
    <div class="form-wrapper">
        <!-- Login Form -->
        <form method="POST" 
              action="/login" 
              data-tab-content="login"
              class="{% if 'register' not in request.path %}active initial-animate{% endif %}">
            <div>
                <label>Username:</label>
                <input type="text" name="username" required maxlength="32" autocomplete="username">
            </div>

            <div>
                <label>Password:</label>
                <input type="password" name="password" required maxlength="200" autocomplete="current-password">
            </div>

            <input type="hidden" name="fingerprint" id="login-fingerprint">
            <button class="submitbtn" type="submit">Login</button>
        </form>

        <!-- Register Form -->
        <form method="POST" 
              action="/register" 
              data-tab-content="register"
              class="{% if 'register' in request.path %}active initial-animate{% endif %}">
            <div>
                <label>Username:</label>
                <input type="text" name="username" maxlength="32" required autocomplete="username">
            </div>

            <div>
                <label>Email:</label>
                <input type="email" name="email" maxlength="200" required autocomplete="email">
            </div>

            <div>
                <label>Password:</label>
                <input type="password" name="password" maxlength="200" required autocomplete="new-password">
            </div>

            <input type="hidden" name="fingerprint" id="register-fingerprint">
            <button class="submitbtn" type="submit">Registrati</button>
        </form>
    </div>

    <!-- Bottom text -->
    <p></p>

    <!-- CSRF Management -->
    <script src="/jsandcss/csrf.js"></script>

    <!-- Auth JavaScript -->
    <script src="/jsandcss/notify.js"></script>
    <script src="/jsandcss/auth/js/toggle.js"></script>
    <script src="/jsandcss/auth/js/init.js"></script>
    <script src="/jsandcss/darkness.js"></script>

    <!-- Service Worker -->
    <script src="/service-worker.js"></script>
    <!-- Fingerprint + Ban Check -->
    <script>
    (function(){
        // Simple fingerprint from browser properties
        function generateFingerprint(){
            var canvas = document.createElement('canvas');
            var ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.fillText('fp', 2, 2);
            var canvasData = canvas.toDataURL();
            var raw = [
                navigator.userAgent,
                navigator.language,
                screen.width + 'x' + screen.height,
                screen.colorDepth,
                new Date().getTimezoneOffset(),
                navigator.hardwareConcurrency || '',
                navigator.platform || '',
                canvasData
            ].join('|');
            // Simple hash
            var hash = 0;
            for(var i = 0; i < raw.length; i++){
                var c = raw.charCodeAt(i);
                hash = ((hash << 5) - hash) + c;
                hash |= 0;
            }
            return 'fp_' + Math.abs(hash).toString(36);
        }
        var fp = generateFingerprint();
        var el1 = document.getElementById('login-fingerprint');
        var el2 = document.getElementById('register-fingerprint');
        if(el1) el1.value = fp;
        if(el2) el2.value = fp;

        // Check if banned (via URL param)
        var params = new URLSearchParams(window.location.search);
        if(params.get('banned') === '1'){
            window.location.href = '/banned';
        }
    })();
    </script>
</body>
</html>
