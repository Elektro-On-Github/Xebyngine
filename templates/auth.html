<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Xebyngine</title>
    
    <!-- Auth CSS -->
    <link rel="stylesheet" href="/jsandcss/auth/css/auth.css">
</head>
<body>
    <!-- Tab Switcher -->
    <div class="tab-switcher">
        <button type="button" 
                class="tab-btn {% if 'register' not in request.path %}active{% endif %}" 
                data-tab="login">
            Login
        </button>
        <button type="button" 
                class="tab-btn {% if 'register' in request.path %}active{% endif %}" 
                data-tab="register">
            Registrati
        </button>
    </div>

    <!-- Title -->
    <h2 class="ready" data-login-text="Accedi" data-register-text="Crea un account">
        {% if 'register' in request.path %}Crea un account{% else %}Accedi{% endif %}
    </h2>

    <!-- Forms Container -->
    <div class="form-wrapper">
        <!-- Login Form -->
        <form method="POST" 
              action="/login" 
              data-tab-content="login"
              class="{% if 'register' not in request.path %}active initial-animate{% endif %}">
            <div>
                <label>Username:</label>
                <input type="text" name="username" required maxlength="32" autocomplete="username">
            </div>

            <div>
                <label>Password:</label>
                <input type="password" name="password" required maxlength="200" autocomplete="current-password">
            </div>

            <button class="submitbtn" type="submit">Login</button>
        </form>

        <!-- Register Form -->
        <form method="POST" 
              action="/register" 
              data-tab-content="register"
              class="{% if 'register' in request.path %}active initial-animate{% endif %}">
            <div>
                <label>Username:</label>
                <input type="text" name="username" maxlength="32" required autocomplete="username">
            </div>

            <div>
                <label>Email:</label>
                <input type="email" name="email" maxlength="200" required autocomplete="email">
            </div>

            <div>
                <label>Password:</label>
                <input type="password" name="password" maxlength="200" required autocomplete="new-password">
            </div>

            <button class="submitbtn" type="submit">Registrati</button>
        </form>
    </div>

    <!-- Bottom text -->
    <p></p>

    <!-- CSRF Management -->
    <script src="/jsandcss/auth/js/csrf.js"></script>

    <!-- Auth JavaScript -->
    <script src="/jsandcss/auth/js/toggle.js"></script>
    <script src="/jsandcss/auth/js/init.js"></script>
    <script src="/jsandcss/darkness.js"></script>

    <!-- Service Worker -->
    <script src="/service-worker.js"></script>
</body>
</html>
