<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>Testiny</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/jsandcss/chat/css/main.css">
<link rel="stylesheet" href="/jsandcss/chat/css/chat.css">
<link rel="stylesheet" href="/jsandcss/chat/css/messages.css">
<link rel="stylesheet" href="/jsandcss/chat/css/input.css">
<link rel="stylesheet" href="/jsandcss/chat/css/users-menu.css">
<link rel="stylesheet" href="/jsandcss/chat/css/components.css">
<link rel="stylesheet" href="/jsandcss/chat/css/responsive.css">
<link rel="stylesheet" href="/jsandcss/chat/css/call.css">
</head>
<body>

<script type="application/json" id="chat-data">
{
    "myId": "{{ my_id }}",
    "pinnedUsers": {{ pinned_users|tojson }},
    "initialChat": {% if initial_chat is defined and initial_chat %}{{ initial_chat|tojson }}{% else %}null{% endif %}
}
</script>

<!-- TEMPLATES -->
<template id="user-item-template">
    <div class="user-item">
        <img class="user-avatar" alt="avatar">
        <div class="user-meta">
            <div class="user-row">
                <span class="user-name"></span>
                <span class="user-time"></span>
            </div>
            <div class="user-preview"></div>
        </div>
    </div>
</template>

<template id="typing-template">
    <div class="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
    </div>
</template>

<!-- HEADER -->
<div class="app-header">
    <div class="header-left">
        <button class="header-btn" onclick="handleBackButton()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="chat-user-info" id="chat-user-info" onclick="ChatConfig.activeChatId && (window.location.href='/profile/'+ChatConfig.activeChatId)">
            <img class="chat-user-avatar" src="/static/default.png" alt="avatar">
            <span class="chat-user-name"></span>
        </div>
    </div>
    <!-- NUOVI BOTTONI CHIAMATA -->
    <div class="header-call-btns" id="call-buttons" style="display: none;">
        <button class="header-call-btn" id="voice-call-btn" title="Chiamata vocale" disabled>
            <i class="fas fa-phone"></i>
        </button>
        <button class="header-call-btn" id="video-call-btn" title="Videochiamata" disabled>
            <i class="fas fa-video"></i>
        </button>
    </div>
</div>

<!-- CALL OVERLAY-->
<div id="call-overlay">
    <div class="call-content">
        <!-- Video containers -->
        <div class="video-container">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
        </div>
        
        <!-- Call info (mostrato durante squillo) -->
        <div class="call-info" id="call-info">
            <img class="call-avatar" id="call-avatar" src="/static/default.png" alt="avatar">
            <h2 class="call-username" id="call-username"></h2>
            <p class="call-status" id="call-status">Chiamata in corso...</p>
        </div>
        
        <!-- Call controls -->
        <div class="call-controls">
            <button class="call-btn mute" id="mute-btn" title="Muto">
                <i class="fas fa-microphone"></i>
            </button>
            <button class="call-btn hangup" id="hangup-btn" title="Riaggancia">
                <i class="fas fa-phone-slash"></i>
            </button>
            <button class="call-btn video-toggle" id="video-toggle-btn" title="Video on/off">
                <i class="fas fa-video"></i>
            </button>
            <div class="audio-indicator" id="audio-indicator" style="display: none;">
                <i class="fas fa-volume-up"></i>
            </div>
        </div>
    </div>
</div>

<!-- CALL IN ARRIVO -->
 <div class="incoming-call" id="incoming-call">
    <img class="incoming-call-avatar" id="incoming-avatar" src="/static/default.png" alt="avatar">
    <div class="incoming-call-info">
        <strong id="incoming-username">Username</strong>
        <span id="incoming-type">Chiamata vocale...</span>
    </div>
    <div class="incoming-call-actions">
        <button class="incoming-call-btn accept" id="accept-call-btn">
            <i class="fas fa-phone"></i>
        </button>
        <button class="incoming-call-btn reject" id="reject-call-btn">
            <i class="fas fa-phone-slash"></i>
        </button>
    </div>
</div>

<!-- CHAT -->
<div id="chat-container">
    <div id="chat"></div>
</div>

<!-- INPUT -->
<div id="input-container">
    <input type="text" id="message-input" placeholder="Scrivi un messaggio..." maxlength="4096" required/>
    <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
</div>

<!-- USERS MENU -->
<div id="users-menu">
    <div class="menu-header">
        <h2><i class="fas fa-comments"></i> Testiny</h2>
        <button class="close-menu-btn" onclick="window.location.href='/'">
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>
    <div id="users-list"></div>
</div>

<!-- Navbar -->
<nav class="navbar">
    <form action="/" style="margin:0;">
        <button class="nav-btn" title="Profilo"><i class="fa-solid fa-user"></i></button>
    </form>
    <form action="/my_pins" style="margin:0;">
        <button class="nav-btn" title="Pins"><i class="fa-solid fa-thumbtack"></i></button>
    </form>
    <form action="/chat" style="margin:0;">
        <button class="nav-btn" title="Chat"><i class="fa-solid fa-envelope"></i></button>
    </form>
    <form action="{{ url_for('posts_bp.create') }}" method="get" style="margin:0;">
        <button id="fab-create" type="submit" class="nav-btn" title="Crea post"><i class="fa-solid fa-plus"></i></button>
    </form>
</nav>

<script src="/jsandcss/chat/js/csrf.js"></script>
<script src="/jsandcss/chat/js/config.js"></script>
<script src="/jsandcss/chat/js/ui.js"></script>
<script src="/jsandcss/chat/js/chat.js"></script>
<script src="/jsandcss/chat/js/sse.js"></script>
<script src="/jsandcss/chat/js/init.js"></script>
<script src="/jsandcss/darkness.js"></script>
<script src="/service-worker.js"></script>
<script src="/jsandcss/chat/js/webrtc.js"></script>

</body>
</html>
