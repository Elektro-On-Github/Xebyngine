<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>Messaggi</title>
<link rel="stylesheet" href="/jsandcss/dirty.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/jsandcss/chat/css/main.css">
<link rel="stylesheet" href="/jsandcss/chat/css/chat.css">
<link rel="stylesheet" href="/jsandcss/chat/css/messages.css">
<link rel="stylesheet" href="/jsandcss/chat/css/input.css">
<link rel="stylesheet" href="/jsandcss/chat/css/users-menu.css">
<link rel="stylesheet" href="/jsandcss/chat/css/components.css">
<link rel="stylesheet" href="/jsandcss/chat/css/responsive.css">
<link rel="stylesheet" href="/jsandcss/chat/css/e2ee.css">
<link rel="stylesheet" href="/jsandcss/index/css/modals.css">
<link rel="stylesheet" href="/jsandcss/index/css/profile.css">
<link rel="stylesheet" href="/jsandcss/index/css/components.css">
<link rel="stylesheet" href="/jsandcss/index/css/dinamico.css">
<link rel="stylesheet" href="/jsandcss/notify.css">
<style>
#search-overlay { z-index: 12000; }
</style>
</head>
<body>

<script type="application/json" id="chat-data">
{
    "myId": "{{ my_id }}",
    "pinnedUsers": {{ pinned_users|tojson }},
    "initialChat": {% if initial_chat is defined and initial_chat %}{{ initial_chat|tojson }}{% else %}null{% endif %}
}
</script>

<!-- TEMPLATES -->
<template id="user-item-template">
    <div class="user-item">
        <img class="user-avatar" alt="avatar">
        <div class="user-meta">
            <div class="user-row">
                <span class="user-name"></span>
                <span class="user-time"></span>
            </div>
            <div class="user-preview"></div>
        </div>
    </div>
</template>

<template id="typing-template">
    <div class="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
    </div>
</template>

<!-- HEADER -->
<div class="app-header">
    <div class="header-left">
        <button class="header-btn" onclick="handleBackButton()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="chat-user-info" id="chat-user-info" onclick="ChatConfig.activeChatId && (window.location.href='/user/'+ChatConfig.activeChatUsername)">
            <img class="chat-user-avatar" src="/uploads/avatars/default.png" alt="avatar">
            <span class="chat-user-name"></span>
        </div>
    </div>
</div>

<!-- CHAT -->
<div id="chat-container">
    <div id="chat"></div>
</div>

<!-- INPUT -->
<div id="input-container">
    <input type="text" id="message-input" placeholder="Scrivi un messaggio..." maxlength="4096" required/>
    <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
</div>

<!-- USERS MENU -->
<div id="users-menu">
    <div class="menu-header">
        <h2><i class="fas fa-comments"></i> Messaggi</h2>
        <button class="close-menu-btn" onclick="history.back()">
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>
    <div id="users-list"></div>
</div>

<!-- Navbar -->
<nav class="navbar">
    <form action="/user/{{ username }}" style="margin:0;">
        <button class="nav-btn" title="Profilo"><i class="fa-solid fa-user"></i></button>
    </form>
    <form action="/my_pins" style="margin:0;">
        <button class="nav-btn" title="Pins"><i class="fa-solid fa-thumbtack"></i></button>
    </form>
    <form action="/chat" style="margin:0;">
        <button class="nav-btn" title="Chat"><i class="fa-solid fa-envelope"></i></button>
    </form>
    <form action="{{ url_for('posts_bp.create') }}" method="get" style="margin:0;">
        <button id="fab-create" type="submit" class="nav-btn" title="Crea post"><i class="fa-solid fa-plus"></i></button>
    </form>
</nav>

<button id="open-search-overlay" title="Cerca" class="navbar-search">
    <i class="fa-solid fa-magnifying-glass"></i>
</button>

<div id="search-overlay">
    <div class="overlay-panel" id="search-overlay-panel">
        <div style="display:flex; align-items:center; gap:8px; padding:12px;">
            <button class="back-btn-search" id="close-search-overlay" style="background:none;border:none;color:rgba(144, 16, 16, 1);font-size:1.3em;cursor:pointer;width:40px;height:40px;border-radius: 50px;"><i class="fa-solid fa-arrow-left"></i></button>
            <div style="position:relative; flex:1;">
                <input id="overlay-search-input" class="comment-input" type="text" placeholder="Cerca post e utenti">
                <button id="overlay-clear-btn" type="button" title="Annulla" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:6px;">
                    <i class="fa-solid fa-xmark" style="color:#000000; font-size:18px;"></i>
                </button>
            </div>
            <button id="overlay-send-btn" type="button" class="comment-send-btn" title="Cerca">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        <div style="padding:12px; overflow:auto; flex:1;">
            <div id="overlay-results"></div>
            <div id="overlay-history"></div>
        </div>
    </div>
</div>

<script src="/jsandcss/csrf.js"></script>
<script src="/jsandcss/dirty.js"></script>
<script src="/jsandcss/notify.js"></script>
<script src="/jsandcss/chat/js/config.js"></script>
<script src="/jsandcss/chat/js/ui.js"></script>
<script src="/jsandcss/chat/js/messages.js"></script>
<script src="/jsandcss/chat/js/chat.js"></script>
<script src="/jsandcss/chat/js/sse.js"></script>
<script>
window.LOGGED_USERNAME = window.LOGGED_USERNAME || null;
window.LOGGED_AVATAR = window.LOGGED_AVATAR || null;
window.POSTS_BY_ID = window.POSTS_BY_ID || {};
window.INDEX_SEARCH_MODE = false;
window.INDEX_QUERY = '';
window.INDEX_QUERY_RAW = '';
</script>
<script src="/jsandcss/index/js/utils.js"></script>
<script src="/jsandcss/index/js/search.js"></script>
<script src="/jsandcss/darkness.js"></script>
<!-- E2EE Scripts -->
<script src="/jsandcss/chat/js/e2ee-compat.js"></script>
<script src="/jsandcss/chat/js/e2ee.js"></script>
<script src="/jsandcss/chat/js/e2ee-chat.js"></script>
<script src="/service-worker.js"></script>
<script src="/jsandcss/chat/js/init.js"></script>

</body>
</html>
