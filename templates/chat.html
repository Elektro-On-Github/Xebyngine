<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>Chat con {{ other_username }}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Chat CSS -->
<link rel="stylesheet" href="/jsandcss/chat/css/main.css">
<link rel="stylesheet" href="/jsandcss/chat/css/chat.css">
<link rel="stylesheet" href="/jsandcss/chat/css/messages.css">
<link rel="stylesheet" href="/jsandcss/chat/css/input.css">
<link rel="stylesheet" href="/jsandcss/chat/css/users-menu.css">
<link rel="stylesheet" href="/jsandcss/chat/css/components.css">
<link rel="stylesheet" href="/jsandcss/chat/css/responsive.css">
</head>
<body>

<!-- Data from template (JSON format - not executable code, CSP compliant) -->
<script type="application/json" id="chat-data">
{
    "myId": "{{ my_id }}",
    "pinnedUsers": {{ pinned_users|tojson }},
    "initialChat": {% if initial_chat is defined and initial_chat %}{{ initial_chat|tojson }}{% else %}null{% endif %}
}
</script>

<!-- HEADER -->
<div class="app-header">
    <div class="header-left">
        <button class="header-btn" id="back-btn" onclick="handleBackButton()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="chat-user-info" id="chat-user-info"></div>
    </div>
</div>

<!-- CHAT AREA -->
<div id="chat-container">
    <div id="chat"></div>
</div>

<!-- INPUT BAR -->
<div id="input-container">
    <input type="text" id="message-input" placeholder="Scrivi un messaggio..." maxlength="4096" required/>
    <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
</div>

<!-- USERS MENU -->
<div id="users-menu">
    <div class="menu-header">
        <h2><i class="fas fa-comments"></i> Testiny</h2>
        <button class="close-menu-btn" onclick="window.location.href='/'">
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>
    <div id="users-list"></div>
</div>

<!-- CSRF Management (CRITICAL - DO NOT REMOVE) -->
<script src="/jsandcss/chat/js/csrf.js"></script>

<!-- Chat JavaScript -->
<script src="/jsandcss/chat/js/config.js"></script>
<script src="/jsandcss/chat/js/ui.js"></script>
<script src="/jsandcss/chat/js/messages.js"></script>
<script src="/jsandcss/chat/js/users.js"></script>
<script src="/jsandcss/chat/js/chat.js"></script>
<script src="/jsandcss/chat/js/sse.js"></script>
<script src="/jsandcss/chat/js/init.js"></script>
<script src="/jsandcss/darkness.js"></script>

<!-- Service Worker -->
<script src="/jsandcss/sw-linked.js"></script>

</body>
</html>
